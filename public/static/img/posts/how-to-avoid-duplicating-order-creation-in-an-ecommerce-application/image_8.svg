  <rect x="20" y="136" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="30" y="166" class="c">2. Check-then-insert</text>
  <rect x="246" y="136" width="100" height="50" rx="8" class="rd"/>
  <text x="296.0" y="158" class="m c">Không</text><text x="296.0" y="175" class="m c">đảm bảo</text>
  <rect x="352" y="136" width="100" height="50" rx="8" class="rd"/>
  <text x="402.0" y="158" class="m c">Không</text><text x="402.0" y="175" class="m c">đảm bảo</text>
  <rect x="458" y="136" width="100" height="50" rx="8" class="rd"/>
  <text x="508.0" y="166" class="m c">Không</text>
  <rect x="564" y="136" width="100" height="50" rx="8" class="rd"/>
  <text x="614.0" y="166" class="m c">Không</text>
  <rect x="670" y="136" width="100" height="50" rx="8" class="ok"/>
  <text x="720.0" y="166" class="m c">Thấp</text>
  <rect x="20" y="192" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="30" y="222" class="c">3. Idempotency-Key + UNIQUE</text>
  <rect x="246" y="192" width="100" height="50" rx="8" class="ok"/>
  <text x="296.0" y="222" class="m c">Có</text>
  <rect x="352" y="192" width="100" height="50" rx="8" class="ok"/>
  <text x="402.0" y="222" class="m c">Có</text>
  <rect x="458" y="192" width="100" height="50" rx="8" class="ok"/>
  <text x="508.0" y="222" class="m c">Có</text>
  <rect x="564" y="192" width="100" height="50" rx="8" class="rd"/>
  <text x="614.0" y="222" class="m c">Không</text>
  <rect x="670" y="192" width="100" height="50" rx="8" class="ok"/>
  <text x="720.0" y="222" class="m c">Thấp</text>
  <rect x="20" y="248" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="30" y="278" class="c">4. Idempotency record</text>
  <rect x="246" y="248" width="100" height="50" rx="8" class="ok"/>
  <text x="296.0" y="278" class="m c">Có</text>
  <rect x="352" y="248" width="100" height="50" rx="8" class="ok"/>
  <text x="402.0" y="270" class="m c">Có</text><text x="402.0" y="287" class="m s" style="font-size:12px">kiểm tra nội dung</text>
  <rect x="458" y="248" width="100" height="50" rx="8" class="ok"/>
  <text x="508.0" y="278" class="m c">Có</text>
  <rect x="564" y="248" width="100" height="50" rx="8" class="wn"/>
  <text x="614.0" y="278" class="m c">Một phần</text>
  <rect x="670" y="248" width="100" height="50" rx="8" class="wn"/>
  <text x="720.0" y="278" class="m c">Trung bình</text>
  <rect x="20" y="304" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="30" y="334" class="c">5. Redis SET NX + DB</text>
  <rect x="246" y="304" width="100" height="50" rx="8" class="ok"/>
  <text x="296.0" y="334" class="m c">Có</text>
  <rect x="352" y="304" width="100" height="50" rx="8" class="ok"/>
  <text x="402.0" y="326" class="m c">Có</text><text x="402.0" y="343" class="m s" style="font-size:12px">có thể 409</text>
  <rect x="458" y="304" width="100" height="50" rx="8" class="ok"/>
  <text x="508.0" y="334" class="m c">Có</text>
  <rect x="564" y="304" width="100" height="50" rx="8" class="rd"/>
  <text x="614.0" y="334" class="m c">Không</text>
  <rect x="670" y="304" width="100" height="50" rx="8" class="rd"/>
  <text x="720.0" y="334" class="m c">Cao</text>
  <rect x="20" y="360" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="30" y="390" class="c">6. Checkout token</text>
  <rect x="246" y="360" width="100" height="50" rx="8" class="ok"/>
  <text x="296.0" y="390" class="m c">Có</text>
  <rect x="352" y="360" width="100" height="50" rx="8" class="ok"/>
  <text x="402.0" y="382" class="m c">Có</text><text x="402.0" y="399" class="m s" style="font-size:12px">có thể 400</text>
  <rect x="458" y="360" width="100" height="50" rx="8" class="ok"/>
  <text x="508.0" y="390" class="m c">Có</text>
  <rect x="564" y="360" width="100" height="50" rx="8" class="ok"/>
  <text x="614.0" y="382" class="m c">Có</text><text x="614.0" y="399" class="m s" style="font-size:12px">kèm rate limit</text>
  <rect x="670" y="360" width="100" height="50" rx="8" class="rd"/>
  <text x="720.0" y="390" class="m c">Cao</text>
  <rect x="20" y="430" width="22" height="22" rx="4" class="ok"/><text x="50" y="447" class="s">Đáp ứng tốt</text>
  <rect x="190" y="430" width="22" height="22" rx="4" class="wn"/><text x="220" y="447" class="s">Một phần, có điều kiện</text>
  <rect x="430" y="430" width="22" height="22" rx="4" class="rd"/><text x="460" y="447" class="s">Không đáp ứng, hoặc chi phí cao</text>
