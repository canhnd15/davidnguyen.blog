<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Bấm đúp, refresh, client retry, message redelivery, bot và replay cùng đi vào API tạo đơn và sinh ra nhiều order">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1E293B}
    .s{font-size:14px;fill:#475569}
    .m{text-anchor:middle}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}
    .no{fill:#FEE2E2;stroke:#DC2626;stroke-width:2}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:2}
    .gr{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.5}
    .ln{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
    .ll{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="800" height="470" fill="#F8FAFC"/>
  <rect x="30" y="30" width="190" height="40" rx="8" class="bx"/><text x="125" y="55" class="m">Bấm đúp</text>
  <line x1="222" y1="50" x2="326" y2="150" class="ln"/>
  <rect x="30" y="92" width="190" height="40" rx="8" class="bx"/><text x="125" y="117" class="m">Refresh / back</text>
  <line x1="222" y1="112" x2="326" y2="164" class="ln"/>
  <rect x="30" y="154" width="190" height="40" rx="8" class="bx"/><text x="125" y="179" class="m">Client, gateway retry</text>
  <line x1="222" y1="174" x2="326" y2="178" class="ln"/>
  <rect x="30" y="216" width="190" height="40" rx="8" class="bx"/><text x="125" y="241" class="m">Message redelivery</text>
  <line x1="222" y1="236" x2="326" y2="192" class="ln"/>
  <rect x="30" y="278" width="190" height="40" rx="8" class="wn"/><text x="125" y="303" class="m">Bot / script</text>
  <line x1="222" y1="298" x2="326" y2="206" class="ln"/>
  <rect x="30" y="340" width="190" height="40" rx="8" class="wn"/><text x="125" y="365" class="m">Replay attack</text>
  <line x1="222" y1="360" x2="326" y2="220" class="ln"/>
  <rect x="330" y="130" width="160" height="110" rx="10" class="gr"/>
  <text x="410" y="177" class="m" style="font-weight:bold">API tạo đơn</text>
  <text x="410" y="203" class="m s">POST /api/orders</text>
  <line x1="492" y1="185" x2="598" y2="132" class="ln"/>
  <rect x="600" y="110" width="170" height="44" rx="8" class="no"/><text x="685" y="138" class="m">Order #1</text>
  <line x1="492" y1="185" x2="598" y2="202" class="ln"/>
  <rect x="600" y="180" width="170" height="44" rx="8" class="no"/><text x="685" y="208" class="m">Order #2</text>
  <line x1="492" y1="185" x2="598" y2="272" class="ln"/>
  <rect x="600" y="250" width="170" height="44" rx="8" class="no"/><text x="685" y="278" class="m">Order #3</text>
  <text x="685" y="330" class="m s">cùng một lần mua</text>
  <rect x="100" y="402" width="600" height="52" rx="10" class="no"/><text x="400" y="433" class="m" style="font-weight:bold">Một ý định mua sinh ra nhiều order: trừ tiền, trừ kho hai lần</text>
</svg>
