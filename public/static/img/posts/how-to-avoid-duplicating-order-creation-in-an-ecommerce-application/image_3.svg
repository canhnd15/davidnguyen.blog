<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Request A và B cùng SELECT thấy chưa có đơn, rồi cùng INSERT, kết quả là hai order">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1E293B}
    .s{font-size:14px;fill:#475569}
    .m{text-anchor:middle}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}
    .no{fill:#FEE2E2;stroke:#DC2626;stroke-width:2}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:2}
    .gr{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.5}
    .ln{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
    .ll{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="800" height="470" fill="#F8FAFC"/>
  <rect x="50" y="20" width="160" height="40" rx="8" class="bx"/><text x="130" y="46" class="m">Request A</text>
  <rect x="320" y="20" width="160" height="40" rx="8" class="gr"/><text x="400" y="46" class="m">Database</text>
  <rect x="590" y="20" width="160" height="40" rx="8" class="bx"/><text x="670" y="46" class="m">Request B</text>
  <line x1="130" y1="60" x2="130" y2="380" class="ll"/>
  <line x1="400" y1="60" x2="400" y2="380" class="ll"/>
  <line x1="670" y1="60" x2="670" y2="380" class="ll"/>
  <line x1="132" y1="105" x2="396" y2="105" class="ln"/>
  <text x="265" y="95" class="m">1. SELECT theo user, cart</text>
  <line x1="668" y1="165" x2="404" y2="165" class="ln"/>
  <text x="535" y="155" class="m">2. SELECT theo user, cart</text>
  <rect x="340" y="115" width="120" height="28" rx="6" class="gr"/><text x="400" y="135" class="m s">0 dòng</text>
  <rect x="50" y="115" width="160" height="28" rx="6" class="ok"/><text x="130" y="135" class="m s">chưa có đơn, tạo mới</text>
  <rect x="590" y="175" width="160" height="28" rx="6" class="ok"/><text x="670" y="195" class="m s">chưa có đơn, tạo mới</text>
  <line x1="132" y1="255" x2="396" y2="255" class="ln"/>
  <text x="265" y="245" class="m">3. INSERT order</text>
  <line x1="668" y1="315" x2="404" y2="315" class="ln"/>
  <text x="535" y="305" class="m">4. INSERT order</text>
  <rect x="100" y="400" width="600" height="52" rx="10" class="no"/>
  <text x="400" y="431" class="m" style="font-weight:bold">Cả hai INSERT đều thành công: hai order cho một giỏ hàng</text>
</svg>
