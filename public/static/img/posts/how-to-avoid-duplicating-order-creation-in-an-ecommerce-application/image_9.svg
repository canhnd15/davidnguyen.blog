<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 555" role="img" aria-label="Sơ đồ chọn cách tiếp cận: bắt đầu từ Idempotency-Key và UNIQUE, thêm idempotency record để kiểm tra nội dung, thêm Redis SET NX khi database quá tải, thêm checkout token khi có bot">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1E293B}
    .s{font-size:14px;fill:#475569}
    .c{font-size:13px;fill:#1E293B}
    .m{text-anchor:middle}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:2}
    .rd{fill:#FEE2E2;stroke:#DC2626;stroke-width:2}
    .ll{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
    .tm{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="800" height="555" fill="#F8FAFC"/>
  <rect x="40" y="20" width="300" height="50" rx="8" class="ok"/><text x="190" y="42" class="m">Bắt đầu: Idempotency-Key</text><text x="190" y="60" class="m s">+ UNIQUE constraint (cách 3)</text>
  <path d="M190 70 L190 108" class="tm"/><text x="202" y="95.0" class="s"></text>
  <rect x="40" y="110" width="300" height="60" rx="8" class="wn"/>
  <text x="190" y="136" class="m s">Cần kiểm tra nội dung request,</text><text x="190" y="156" class="m s">hoặc dùng chung nhiều thao tác?</text>
  <path d="M340 140 L438 140" class="tm"/><text x="389" y="132" class="m s">Có</text>
  <rect x="440" y="112" width="320" height="56" rx="8" class="bx"/><text x="600" y="137" class="m">Thêm bảng idempotency</text><text x="600" y="156" class="m">record (cách 4)</text>
  <path d="M190 170 L190 218" class="tm"/><text x="202" y="200.0" class="s">Không</text>
  <rect x="40" y="220" width="300" height="60" rx="8" class="wn"/>
  <text x="190" y="246" class="m s">Database quá tải vì request trùng?</text><text x="190" y="266" class="m s">(ví dụ flash sale)</text>
  <path d="M340 250 L438 250" class="tm"/><text x="389" y="242" class="m s">Có</text>
  <rect x="440" y="222" width="320" height="56" rx="8" class="bx"/><text x="600" y="247" class="m">Thêm Redis SET NX</text><text x="600" y="266" class="m">phía trước (cách 5)</text>
  <path d="M190 280 L190 328" class="tm"/><text x="202" y="310.0" class="s">Không</text>
  <rect x="40" y="330" width="300" height="60" rx="8" class="wn"/>
  <text x="190" y="365" class="m s">Có bot, mỗi request một key khác?</text>
  <path d="M340 360 L438 360" class="tm"/><text x="389" y="352" class="m s">Có</text>
  <rect x="440" y="332" width="320" height="56" rx="8" class="bx"/><text x="600" y="357" class="m">Thêm checkout token</text><text x="600" y="376" class="m">kèm rate limit (cách 6)</text>
  <path d="M190 390 L190 438" class="tm"/><text x="202" y="415" class="s">Không</text>
  <rect x="40" y="440" width="300" height="50" rx="8" class="ok"/><text x="190" y="462" class="m">Giữ nguyên cách 3</text><text x="190" y="480" class="m s">thường là đủ dùng</text>
  <text x="400" y="530" class="m s">Lớp cuối luôn là constraint của database</text>
</svg>
