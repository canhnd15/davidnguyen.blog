<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="Luồng bảng idempotency record: INSERT ON CONFLICT DO NOTHING, 1 dòng thì tạo order và gắn vào record, 0 dòng thì so request hash rồi trả order cũ hoặc báo 422">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1E293B}
    .s{font-size:14px;fill:#475569}
    .c{font-size:13px;fill:#1E293B}
    .m{text-anchor:middle}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:2}
    .rd{fill:#FEE2E2;stroke:#DC2626;stroke-width:2}
    .ll{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
    .tm{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="800" height="490" fill="#F8FAFC"/>

  <rect x="240" y="20" width="320" height="40" rx="8" class="bx"/><text x="400" y="46" class="m">POST /orders + Idempotency-Key</text>
  <path d="M400 60 L400 88" class="tm"/>
  <rect x="170" y="90" width="460" height="54" rx="8" class="bx"/>
  <text x="400" y="113" class="m s">INSERT INTO idempotency_record</text>
  <text x="400" y="132" class="m s">ON CONFLICT DO NOTHING</text>
  <path d="M400 144 L400 168" class="tm"/>
  <rect x="280" y="170" width="240" height="40" rx="8" class="wn"/><text x="400" y="196" class="m">Số dòng được insert?</text>
  <path d="M280 190 L205 190 L205 248" class="tm"/><text x="242" y="182" class="m s">1 dòng</text>
  <path d="M520 190 L595 190 L595 248" class="tm"/><text x="558" y="182" class="m s">0 dòng</text>

  <rect x="30" y="236" width="350" height="210" rx="10" class="ll"/>
  <rect x="40" y="250" width="330" height="40" rx="8" class="ok"/><text x="205" y="275" class="m s">Request đầu tiên: tạo order</text>
  <path d="M205 290 L205 308" class="tm"/>
  <rect x="40" y="310" width="330" height="40" rx="8" class="ok"/><text x="205" y="335" class="m s">Gắn order_id vào record</text>
  <path d="M205 350 L205 368" class="tm"/>
  <rect x="40" y="370" width="330" height="40" rx="8" class="ok"/><text x="205" y="395" class="m s">COMMIT, trả order mới (HTTP 200)</text>
  <text x="205" y="432" class="m s">record và order cùng một transaction</text>

  <rect x="430" y="250" width="330" height="40" rx="8" class="wn"/><text x="595" y="275" class="m s">Key đã tồn tại: đọc record cũ</text>
  <path d="M595 290 L595 308" class="tm"/>
  <rect x="430" y="310" width="330" height="40" rx="8" class="wn"/><text x="595" y="335" class="m s">So sánh request hash</text>
  <path d="M595 350 L595 364 L507 364 L507 380" class="tm"/>
  <path d="M595 364 L682 364 L682 380" class="tm"/>
  <rect x="430" y="382" width="155" height="56" rx="8" class="ok"/>
  <text x="507" y="406" class="m s">Hash khớp:</text><text x="507" y="426" class="m s">trả order cũ</text>
  <rect x="605" y="382" width="155" height="56" rx="8" class="rd"/>
  <text x="682" y="406" class="m s">Hash khác:</text><text x="682" y="426" class="m s">HTTP 422</text>
</svg>
