<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Cách chọn approach: bắt đầu từ atomic UPDATE, thêm reservation khi có bước thanh toán, thêm Redis khi đo được DB là nút cổ chai">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1E293B}
    .s{font-size:14px;fill:#475569}
    .m{text-anchor:middle}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:2}
    .ar{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="800" height="520" fill="#F8FAFC"/>

  <rect x="40" y="20" width="360" height="70" rx="10" class="wn"/>
  <text x="220" y="48" class="m">Logic có cần đọc nhiều dữ liệu</text>
  <text x="220" y="70" class="m">trước khi quyết định trừ kho?</text>
  <line x1="402" y1="55" x2="498" y2="55" class="ar"/><text x="450" y="45" class="m s">có</text>
  <rect x="500" y="20" width="260" height="70" rx="10" class="ok"/>
  <text x="630" y="50" class="m" style="font-weight:bold">Cách 3: pessimistic lock</text>
  <text x="630" y="72" class="m s">khoá dòng rồi xử lý</text>

  <line x1="220" y1="92" x2="220" y2="128" class="ar"/><text x="240" y="115" class="s">không</text>
  <rect x="40" y="130" width="360" height="70" rx="10" class="ok"/>
  <text x="220" y="158" class="m" style="font-weight:bold">Bắt đầu: cách 2</text>
  <text x="220" y="180" class="m s">atomic UPDATE + CHECK (available &gt;= 0)</text>

  <line x1="220" y1="202" x2="220" y2="238" class="ar"/>
  <rect x="40" y="240" width="360" height="70" rx="10" class="wn"/>
  <text x="220" y="268" class="m">Có bước thanh toán giữa lúc</text>
  <text x="220" y="290" class="m">đặt hàng và lúc chốt đơn?</text>
  <line x1="402" y1="275" x2="498" y2="275" class="ar"/><text x="450" y="265" class="m s">có</text>
  <rect x="500" y="240" width="260" height="70" rx="10" class="ok"/>
  <text x="630" y="270" class="m" style="font-weight:bold">Thêm cách 6</text>
  <text x="630" y="292" class="m s">reservation có TTL</text>

  <line x1="220" y1="312" x2="220" y2="348" class="ar"/><text x="240" y="335" class="s">không</text>
  <rect x="40" y="350" width="360" height="70" rx="10" class="wn"/>
  <text x="220" y="378" class="m">Đo được DB là nút cổ chai</text>
  <text x="220" y="400" class="m">ở SKU nóng?</text>
  <line x1="402" y1="385" x2="498" y2="385" class="ar"/><text x="450" y="375" class="m s">có</text>
  <rect x="500" y="350" width="260" height="70" rx="10" class="ok"/>
  <text x="630" y="380" class="m" style="font-weight:bold">Thêm cách 5</text>
  <text x="630" y="402" class="m s">Redis Lua chặn phía trước</text>

  <line x1="220" y1="422" x2="220" y2="458" class="ar"/><text x="240" y="445" class="s">không</text>
  <rect x="40" y="460" width="360" height="44" rx="10" class="bx"/>
  <text x="220" y="488" class="m">Giữ nguyên cách 2, vậy là đủ</text>

  <text x="630" y="470" class="m s">Cách 4 (optimistic lock) chỉ hợp khi xung đột hiếm</text>
</svg>
