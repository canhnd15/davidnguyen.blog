<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Hai request cùng đọc available = 1 rồi cùng trừ kho, dẫn tới oversell">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;font-size:15px;fill:#1E293B}
    .s{font-size:14px;fill:#475569}
    .m{text-anchor:middle}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:2}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}
    .no{fill:#FEE2E2;stroke:#DC2626;stroke-width:2}
    .gr{fill:#F1F5F9;stroke:#94A3B8;stroke-width:1.5}
    .ln{stroke:#64748B;stroke-width:2;fill:none;marker-end:url(#a)}
    .ll{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="800" height="450" fill="#F8FAFC"/>
  <rect x="50" y="20" width="160" height="40" rx="8" class="bx"/><text x="130" y="46" class="m">Request A</text>
  <rect x="320" y="20" width="160" height="40" rx="8" class="gr"/><text x="400" y="46" class="m">Database</text>
  <rect x="590" y="20" width="160" height="40" rx="8" class="bx"/><text x="670" y="46" class="m">Request B</text>
  <line x1="130" y1="60" x2="130" y2="360" class="ll"/>
  <line x1="400" y1="60" x2="400" y2="360" class="ll"/>
  <line x1="670" y1="60" x2="670" y2="360" class="ll"/>

  <line x1="132" y1="110" x2="396" y2="110" class="ln"/>
  <text x="265" y="100" class="m">1. SELECT available</text>
  <rect x="340" y="125" width="120" height="28" rx="6" class="gr"/><text x="400" y="145" class="m s">available = 1</text>

  <line x1="668" y1="190" x2="404" y2="190" class="ln"/>
  <text x="535" y="180" class="m">2. SELECT available</text>
  <rect x="50" y="150" width="160" height="28" rx="6" class="ok"/><text x="130" y="170" class="m s">check ok: 1 &gt;= 1</text>
  <rect x="590" y="215" width="160" height="28" rx="6" class="ok"/><text x="670" y="235" class="m s">check ok: 1 &gt;= 1</text>

  <line x1="132" y1="280" x2="396" y2="280" class="ln"/>
  <text x="265" y="270" class="m">3. UPDATE available = 0</text>
  <line x1="668" y1="330" x2="404" y2="330" class="ln"/>
  <text x="535" y="320" class="m">4. UPDATE available = 0</text>

  <rect x="100" y="380" width="600" height="52" rx="10" class="no"/>
  <text x="400" y="411" class="m" style="font-weight:bold">Cả hai đơn thành công trong khi kho chỉ có 1 sản phẩm: oversell</text>
</svg>
