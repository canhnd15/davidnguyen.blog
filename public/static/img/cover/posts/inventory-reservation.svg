<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Inventory Reservation trong e-commerce">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;fill:#1E293B}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:3}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:3}
    .no{fill:#FEE2E2;stroke:#DC2626;stroke-width:3}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:3}
    .sub{fill:#475569}
  </style>
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <rect x="0" y="0" width="14" height="630" fill="#2563EB"/>
  <text x="70" y="110" font-size="26" font-weight="bold" style="fill:#2563EB">Design an e-commerce system</text>
  <text x="70" y="220" font-size="76" font-weight="bold">Inventory</text>
  <text x="70" y="305" font-size="76" font-weight="bold">Reservation</text>
  <text x="70" y="375" font-size="30" class="sub">Flash sale, high concurrency</text>
  <text x="70" y="420" font-size="30" class="sub">Java &amp; Spring Boot</text>
  <rect x="70" y="480" width="170" height="44" rx="22" class="bx"/>
  <text x="155" y="509" font-size="20" text-anchor="middle">Redis Lua</text>
  <rect x="256" y="480" width="190" height="44" rx="22" class="ok"/>
  <text x="351" y="509" font-size="20" text-anchor="middle">Atomic UPDATE</text>
  <rect x="462" y="480" width="150" height="44" rx="22" class="wn"/>
  <text x="537" y="509" font-size="20" text-anchor="middle">TTL hold</text>

  <rect x="700" y="90" width="430" height="450" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="915" y="140" font-size="24" font-weight="bold" text-anchor="middle">SKU: HEADPHONE-01</text>
  <rect x="740" y="170" width="80" height="60" rx="8" class="ok"/>
  <rect x="830" y="170" width="80" height="60" rx="8" class="ok"/>
  <rect x="920" y="170" width="80" height="60" rx="8" class="ok"/>
  <rect x="1010" y="170" width="80" height="60" rx="8" class="ok"/>
  <rect x="740" y="245" width="80" height="60" rx="8" class="ok"/>
  <rect x="830" y="245" width="80" height="60" rx="8" class="ok"/>
  <rect x="920" y="245" width="80" height="60" rx="8" class="wn"/>
  <rect x="1010" y="245" width="80" height="60" rx="8" class="wn"/>
  <rect x="740" y="320" width="80" height="60" rx="8" class="wn"/>
  <rect x="830" y="320" width="80" height="60" rx="8" class="no"/>
  <rect x="920" y="320" width="80" height="60" rx="8" class="no"/>
  <rect x="1010" y="320" width="80" height="60" rx="8" class="no"/>

  <rect x="740" y="410" width="22" height="22" rx="4" class="ok"/>
  <text x="772" y="428" font-size="18">Còn hàng</text>
  <rect x="880" y="410" width="22" height="22" rx="4" class="wn"/>
  <text x="912" y="428" font-size="18">Đang giữ chỗ</text>
  <rect x="1040" y="410" width="22" height="22" rx="4" class="no"/>
  <text x="1070" y="428" font-size="18">Đã bán</text>
  <text x="915" y="490" font-size="20" text-anchor="middle" class="sub">20.000 request, 100 sản phẩm</text>
