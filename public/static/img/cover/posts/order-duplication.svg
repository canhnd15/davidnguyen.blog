<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Order Duplication trong e-commerce">
  <style>
    text{font-family:Helvetica,Arial,sans-serif;fill:#1E293B}
    .bx{fill:#DBEAFE;stroke:#2563EB;stroke-width:3}
    .ok{fill:#DCFCE7;stroke:#16A34A;stroke-width:3}
    .no{fill:#FEE2E2;stroke:#DC2626;stroke-width:3}
    .wn{fill:#FEF3C7;stroke:#D97706;stroke-width:3}
    .sub{fill:#475569}
    .ln{stroke:#64748B;stroke-width:3;fill:none;marker-end:url(#a)}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker></defs>
  <rect width="1200" height="630" fill="#F8FAFC"/>
  <rect x="0" y="0" width="14" height="630" fill="#2563EB"/>
  <text x="70" y="110" font-size="26" font-weight="bold" style="fill:#2563EB">Design an e-commerce system</text>
  <text x="70" y="220" font-size="76" font-weight="bold">Order</text>
  <text x="70" y="305" font-size="76" font-weight="bold">Duplication</text>
  <text x="70" y="375" font-size="30" class="sub">Flash sale, high concurrency</text>
  <text x="70" y="420" font-size="30" class="sub">Java &amp; Spring Boot</text>
  <rect x="70" y="480" width="210" height="44" rx="22" class="bx"/>
  <text x="175" y="509" font-size="20" text-anchor="middle">Idempotency-Key</text>
  <rect x="296" y="480" width="130" height="44" rx="22" class="ok"/>
  <text x="361" y="509" font-size="20" text-anchor="middle">Redis NX</text>
  <rect x="442" y="480" width="190" height="44" rx="22" class="wn"/>
  <text x="537" y="509" font-size="20" text-anchor="middle">Checkout token</text>

  <rect x="700" y="90" width="430" height="450" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="915" y="135" font-size="24" font-weight="bold" text-anchor="middle">Một lần bấm Đặt hàng</text>
  <rect x="725" y="160" width="140" height="40" rx="8" class="bx"/>
  <text x="795" y="187" font-size="18" text-anchor="middle">Bấm đúp</text>
  <line x1="867" y1="180" x2="928" y2="275.0" class="ln"/>
  <rect x="725" y="212" width="140" height="40" rx="8" class="bx"/>
  <text x="795" y="239" font-size="18" text-anchor="middle">Refresh</text>
  <line x1="867" y1="232" x2="928" y2="285.0" class="ln"/>
  <rect x="725" y="264" width="140" height="40" rx="8" class="bx"/>
  <text x="795" y="291" font-size="18" text-anchor="middle">Retry</text>
  <line x1="867" y1="284" x2="928" y2="295.0" class="ln"/>
  <rect x="725" y="316" width="140" height="40" rx="8" class="bx"/>
  <text x="795" y="343" font-size="18" text-anchor="middle">Redelivery</text>
  <line x1="867" y1="336" x2="928" y2="305.0" class="ln"/>
  <rect x="725" y="368" width="140" height="40" rx="8" class="wn"/>
  <text x="795" y="395" font-size="18" text-anchor="middle">Bot</text>
  <line x1="867" y1="388" x2="928" y2="315.0" class="ln"/>
  <rect x="725" y="420" width="140" height="40" rx="8" class="wn"/>
  <text x="795" y="447" font-size="18" text-anchor="middle">Replay</text>
  <line x1="867" y1="440" x2="928" y2="325.0" class="ln"/>
  <rect x="930" y="245" width="170" height="110" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="3"/>
  <text x="1015" y="295" font-size="20" font-weight="bold" text-anchor="middle">Checkout</text>
  <text x="1015" y="325" font-size="17" text-anchor="middle" class="sub">create order</text>
  <line x1="1015" y1="357" x2="1015" y2="397" class="ln"/>
  <rect x="930" y="400" width="50" height="40" rx="8" class="no"/><text x="955" y="426" font-size="18" text-anchor="middle">#1</text>
  <rect x="990" y="400" width="50" height="40" rx="8" class="no"/><text x="1015" y="426" font-size="18" text-anchor="middle">#2</text>
  <rect x="1050" y="400" width="50" height="40" rx="8" class="no"/><text x="1075" y="426" font-size="18" text-anchor="middle">#3</text>
  <text x="915" y="500" font-size="20" text-anchor="middle" class="sub">Nhiều nguồn, nhiều order</text>
</svg>
